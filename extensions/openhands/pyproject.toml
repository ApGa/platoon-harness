[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "platoon-harness-openhands"
version = "0.1.0"
description = "OpenHands as a platoon-harness harness: a wire worker per agent on the OpenHands SDK."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "Apurva Gandhi", email = "apurvasgandhi@gmail.com" }]
dependencies = [
    "openhands-sdk==1.59.0",
    "openhands-tools==1.59.0",
    "platoon-harness-sdk>=0.1,<0.2",
]

[project.scripts]
platoon-harness-openhands = "platoon_harness_openhands:main"

[tool.hatch.build.targets.wheel]
packages = ["src/platoon_harness_openhands"]

[tool.uv.sources]
platoon-harness-sdk = { workspace = true }
