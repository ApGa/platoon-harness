# A population of pi workers, each in a worktree of its own, under the `git-swarm` preset, on a model you name at an
# endpoint that speaks OpenAI's Chat Completions: commits go to your repository and nominations to a topic everyone
# reads, with at most two workers at once. A script, run.py, owns the session: it starts each worker with its goal,
# records each one's outcome on board `outcomes` and closes the session, so `run` and the terminal UI refuse this team.
# Each worker commits, with nobody there to answer an approval, so the workers allow theirs: they run commands, git
# among them, as you. README.md says how to name the model.

[auth.provider]
env = ["OPENAI_BASE_URL", "OPENAI_API_KEY"]

[roles.worker]
harness = "pi"
auth = "provider"
workspace = "worktree"
count = 0
approvals = "allow"

[topology.git-swarm]
role = "worker"
live = 2

[budget]
turns = 16
wall = "25m"
