# A pi lead, OpenHands workers each in a worktree of its own, and a pi merger in a worktree of its own, on a model you
# name at an endpoint that speaks OpenAI's Chat Completions. Workers add their branches to the queue `merges`, and the
# merger, whom each task wakes, merges each into its own branch with git: the runtime never merges. Each role's
# instructions say its part. The workers commit and the merger merges, with nobody there to answer an approval in a
# headless run, so those two roles allow theirs: they run git as you. The lead only reads, so its approvals deny.
# README.md says how to name the model.

[auth.provider]
env = ["OPENAI_BASE_URL", "OPENAI_API_KEY"]

[roles.lead]
harness = "pi"
auth = "provider"
may_spawn = ["worker"]
approvals = "deny"

[roles.worker]
harness = "openhands"
auth = "provider"
workspace = "worktree"
approvals = "allow"
instructions = """Fix the issue your goal names, with a test, and run `python3 -m unittest`. Add a line for your fix at \
the top of the list under `## Unreleased` in CHANGELOG.md. Commit on your branch, then add a task to the queue `merges` \
whose gist is `merge` and your branch's name. Wait on that task, and when it settles, finish with its result."""

[roles.merger]
harness = "pi"
auth = "provider"
workspace = "worktree"
approvals = "allow"
instructions = """Claim each task on the queue `merges` and merge the branch it names into your own with `git merge \
--no-ff`. Complete the task with what came of that: that it merged, or on a conflict the paths in conflict, leaving the \
merge for a person to see. When the queue is empty, wait for work on it."""

[topology.manager-worker]
manager = "lead"
workers = "worker"

[topology.channels.merges]
kind = "queue"
writers = "role:worker"
readers = "role:merger"
delivery = "wake"

[budget]
turns = 24
wall = "25m"
