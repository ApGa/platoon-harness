# A pi lead and an OpenHands worker in one session, working in your copy of the sample project, the session's `shared`
# workspace, on a model you name at an endpoint that speaks OpenAI's Chat Completions. The lead adds work to the queue
# `tasks` and starts workers, everyone shares the board `notes`, and a worker reports back by message. The lead only
# reads, so its approvals deny, and the worker edits and runs the tests unasked. README.md says how to name the model.

[auth.provider]
env = ["OPENAI_BASE_URL", "OPENAI_API_KEY"]

[roles.lead]
harness = "pi"
auth = "provider"
may_spawn = ["worker"]
approvals = "deny"
instructions = """You read and coordinate: read files with `read`, `grep`, `find` and `ls`, as every command or edit of \
yours is refused."""

[roles.worker]
harness = "openhands"
auth = "provider"
approvals = "allow"
instructions = """Claim a task on the queue `tasks` and do it in this checkout: fix the issue it names, add a test that \
fails without your fix, and run `python3 -m unittest`. Leave your change uncommitted. Post a note on the board `notes`, \
named `fix-` and the issue's number, saying what you changed and what the tests said, citing the task. Complete the \
task citing the note, then finish citing it too."""

[topology.manager-worker]
manager = "lead"
workers = "worker"

[budget]
turns = 16
wall = "20m"
