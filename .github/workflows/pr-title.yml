name: PR title

# A workflow of its own, so that editing a pull request's title or description re-runs only this check.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# The workflow's token reads the repository and nothing more. The job's own permissions replace the workflow's, so its
# token reads its pull request and nothing else. The action is pinned to a commit, the release beside it, so that a tag
# moved upstream changes nothing here.
permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@2252a14e810aa9b85c2d560bd7070c802206ecf6  # v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # The commit form of AGENTS.md: no scope, and a summary in sentence case without a final period.
          disallowScopes: .+
          subjectPattern: ^[A-Z].*[^.]$
          subjectPatternError: >-
            Write the summary of "{title}" in sentence case without a final period, for example
            "feat: Add leased task queue".
          # A squash merge of a single commit suggests that commit's message, not the title, so check it too.
          validateSingleCommit: true
