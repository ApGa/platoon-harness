name: CI

# Pull requests into any branch, so that a pull request stacked on another one is checked too, and pushes to main.
# The slow tests need harness binaries, so they stay out of CI, but for those of the installed wheels, which release.yml
# runs, and the live tests spend model calls on a person's logins, so they never run here.
on:
  pull_request:
  push:
    branches: [main]

# A new push to a pull request or to main cancels the run it makes stale.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# The workflow's token reads the repository and nothing more, and no job asks for more.
permissions:
  contents: read

# Every job runs on a Python that uv manages, as a contributor's machine does, never the runner's own: Ubuntu's 3.12.3
# warns that sqlite's numbered placeholders are named, which later 3.12 releases do not.
env:
  UV_PYTHON_PREFERENCE: only-managed

# Each action is pinned to a commit, the release beside it, so that a tag moved upstream changes nothing here, and the
# checkout keeps no credentials for a later step to read. setup-uv caches nothing: jobs that start together on one cache
# key race to save it, and each that loses warns.
jobs:
  # Every hook of the pre-commit stage on every file: ruff's lint and format, and ty. `--locked` fails when uv.lock is
  # out of date with a pyproject.toml, rather than locking again on the runner.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

  # The fast suite on each Python the packages' classifiers name. UV_PYTHON has uv sync and uv run use the job's
  # Python. Ubuntu's AppArmor keeps unprivileged processes from making user namespaces, which bubblewrap needs, so the
  # job lifts that restriction before the tests, and PLATOON_HARNESS_REQUIRE_BWRAP has a test that needs bubblewrap fail,
  # not skip, if it cannot confine here all the same. Git 2.47.3 is the only git the workspace tests have run on, so an
  # older one fails the job.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    env:
      UV_PYTHON: ${{ matrix.python }}
      PLATOON_HARNESS_REQUIRE_BWRAP: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Install bubblewrap
        run: sudo apt-get update && sudo apt-get install -y bubblewrap

      - name: Let unprivileged processes make user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Check that git is 2.47 or later
        run: git --version && printf '2.47\n%s\n' "$(git --version | cut -d' ' -f3)" | sort -V -C

      - name: Install dependencies
        run: uv sync --locked

      - name: Run the tests
        run: uv run pytest -q -n auto

  # The browser tests, once in each browser, with PLATOON_HARNESS_BROWSERS naming it to the tests, on Playwright's build
  # of it, Chromium's headless shell alone, and the system libraries it needs.
  e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      PLATOON_HARNESS_BROWSERS: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Install the browser
        run: uv run playwright install --with-deps --only-shell "$PLATOON_HARNESS_BROWSERS"

      - name: Run the browser tests
        run: uv run pytest -q -m e2e
