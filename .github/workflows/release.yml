name: Release

# Builds platoon-harness's sdist and wheel, and checks them, on the events ci.yml runs on and on a pushed v* tag. A v*
# tag pushed to this repository publishes them to PyPI by trusted publishing, from the `pypi` environment, once a
# maintainer approves the deployment there (CONTRIBUTING.md, "Releases"). A tag publishes only a commit on main, whose
# CHANGELOG.md dates the version the tag names, and only that version.
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# As in ci.yml: a token that reads the repository and nothing more, and a Python that uv manages. Each action is pinned
# to a commit, the release beside it, and the checkout keeps no credentials for the build backend to read. Every step
# runs on 3.12, the oldest Python the distribution names, uvx's too, which would take the newest, so the tests of the
# installed wheel find in uv's cache, offline, what the steps before them left there. The publish job alone asks for
# more: an OIDC token, which PyPI trades for the right to upload.
permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed
  UV_PYTHON: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # Comparing main with the tagged commit gives identical or behind when the commit is main or one of its
      # ancestors, and ahead or diverged when it is on another branch or was never pushed to one.
      - name: Check that the tagged commit is on main
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status | grep -xE 'identical|behind'

      - name: Check that CHANGELOG.md dates the version
        if: github.ref_type == 'tag'
        run: grep -q "^## ${GITHUB_REF_NAME#v} (2" CHANGELOG.md

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.13"
          enable-cache: false

      # The wheel is built from the sdist, and --no-sources builds it as PyPI would.
      - name: Build the sdist and the wheel
        run: uv build --no-sources

      - name: Check that the tag names the version built
        if: github.ref_type == 'tag'
        run: test -f "dist/platoon_harness-${GITHUB_REF_NAME#v}-py3-none-any.whl"

      # Uploaded before any step below runs code the lock does not pin, so none of it can change what publish uploads.
      # publish still needs every step of this job to pass.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4.6.2
        with:
          name: dist
          path: dist/
          if-no-files-found: error

      - name: Check their metadata and their PyPI description
        run: uvx twine@7.0.0 check --strict dist/*

      - name: Import the library from the wheel alone, in an environment of its own
        run: uv run --isolated --no-project --with dist/*.whl python -I -c "import platoon_harness"

      - name: Run the command line from the wheel with its cli extra, in an environment of its own
        run: uv run --isolated --no-project --with "$(echo dist/*.whl)[cli]" platoon-harness --version

      # The openhands extra resolves with Laminar's proxy excluded, as the checkout's lock has it.
      - name: Resolve the openhands extra with lmnr-claude-code-proxy excluded
        run: echo "platoon-harness[openhands] @ ./$(echo dist/*.whl)" | uv pip compile --excludes <(echo lmnr-claude-code-proxy) -

      - name: Install dependencies
        run: uv sync --locked

      # The wheel built again from this commit and installed in environments of its own, offline, from what the steps
      # above left in uv's cache: alone, with its cli extra, and as a tool.
      - name: Test the wheel as a person installs it
        run: uv run pytest -q -m slow tests/integration/test_installed.py

  publish:
    # Only a v* tag pushed to this repository publishes.
    if: github.repository == 'ApGa/platoon-harness' && github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    # PyPI's trusted publisher for platoon-harness names this repository, this workflow file and this environment.
    environment:
      name: pypi
      url: https://pypi.org/project/platoon-harness/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
