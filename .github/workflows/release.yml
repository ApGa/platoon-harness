name: Release

# Builds the sdists and wheels of the SDK, the command line and the first-party extensions, and checks them, on the events
# ci.yml runs on: what a release would publish, checked before anything is published. It publishes nothing: the names,
# the tags and the trusted publisher a release would publish with are the owner's to rule on (CONTRIBUTING.md,
# "Releases").
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# As in ci.yml: a token that reads the repository and nothing more, and a Python that uv manages. Each action is pinned
# to a commit, the release beside it, and the checkout keeps no credentials for the build backend to read. Every step
# runs on 3.12, the oldest Python the packages name, uvx's too, which would take the newest, so the tests of the
# installed wheels find in uv's cache, offline, what uvx left there.
permissions:
  contents: read

env:
  UV_PYTHON_PREFERENCE: only-managed
  UV_PYTHON: "3.12"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          enable-cache: false

      # Each wheel is built from its sdist, and --no-sources builds each package as PyPI would, without the
      # workspace's sources.
      - name: Build every distribution
        run: uv build --all-packages --no-sources

      - name: Check their metadata and their PyPI descriptions
        run: uvx twine@7.0.0 check --strict dist/*

      - name: Run the command line from the wheels in an environment of its own
        run: uvx --from dist/platoon_harness_cli-*.whl --with dist/platoon_harness_sdk-*.whl platoon-harness --version

      # A first-party extension is a distribution of its own (RFC 0072), which installs beside the SDK alone.
      - name: Load the ACP extension's driver from its wheel and the SDK's, in an environment of their own
        run: uv run --isolated --no-project --with dist/platoon_harness_acp-*.whl --with dist/platoon_harness_sdk-*.whl python -I -c "from platoon_harness.extensions import DRIVERS, load; load(DRIVERS, 'opencode')"

      - name: Install dependencies
        run: uv sync --locked

      # Wheels built again from this commit, installed in an environment of their own, offline, from what the steps
      # above left in uv's cache.
      - name: Test the wheels as a person installs them
        run: uv run pytest -q -m slow tests/integration/test_installed.py
